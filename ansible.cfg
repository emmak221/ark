[defaults]
inventory = inventory/local.yml
roles_path = roles
# Suppress cowsay and reduce noise
nocows = true
# Show task timing for long runs
callback_whitelist = timer
# Don't create .retry files
retry_files_enabled = false
# Suppress deprecation warnings (Ansible 2.24 future changes, not our code)
deprecation_warnings = false
# Increase default timeout for large downloads
timeout = 120

[privilege_escalation]
become = true
become_method = sudo
