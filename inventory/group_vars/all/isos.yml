---
# ╔══════════════════════════════════════════════════════════════╗
# ║  Ark — ISO Inventory                                        ║
# ║  Updated: 2026-11-19                                        ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Each entry defines one ISO to keep in the archive.
# Verify URLs against official release pages before first run —
# version numbers and paths change with new releases.
#
# Fields:
#   name       — directory name in storage (slug)
#   label      — human-readable description
#   url        — direct download URL for the ISO
#   checksum_url — URL to the SHA256SUMS file (optional)
#   arch       — amd64 | arm64 | armhf | multi
#   category   — desktop | server | rescue | iot | embedded

ark_isos:

  # ── Ubuntu 24.04.5 LTS (Noble Numbat) ───────────────────────
  # Final point release of the 24.04 LTS series (Sep 2026).
  # Desktop had a .5.1 respin to fix an installer crash.
  - name: ubuntu-desktop-amd64
    label: "Ubuntu 24.04.5.1 LTS Desktop (amd64)"
    url: "https://releases.ubuntu.com/noble/ubuntu-24.04.5.1-desktop-amd64.iso"
    checksum_url: "https://releases.ubuntu.com/noble/SHA256SUMS"
    arch: amd64
    category: desktop

  - name: ubuntu-server-amd64
    label: "Ubuntu 24.04.5 LTS Server (amd64)"
    url: "https://releases.ubuntu.com/noble/ubuntu-24.04.5-live-server-amd64.iso"
    checksum_url: "https://releases.ubuntu.com/noble/SHA256SUMS"
    arch: amd64
    category: server

  - name: ubuntu-server-arm64
    label: "Ubuntu 24.04.5 LTS Server (arm64)"
    url: "https://cdimage.ubuntu.com/releases/noble/release/ubuntu-24.04.5-live-server-arm64.iso"
    checksum_url: "https://cdimage.ubuntu.com/releases/noble/release/SHA256SUMS"
    arch: arm64
    category: server

  # ── Linux Mint 22.3 "Zena" ──────────────────────────────────
  # Released January 2026, based on Ubuntu 24.04.3 LTS.
  # Supported through April 2029.
  - name: mint-cinnamon-amd64
    label: "Linux Mint 22.3 Zena Cinnamon (amd64)"
    url: "https://mirrors.kernel.org/linuxmint/stable/22.3/linuxmint-22.3-cinnamon-64bit.iso"
    checksum_url: "https://mirrors.kernel.org/linuxmint/stable/22.3/sha256sum.txt"
    arch: amd64
    category: desktop

  # ── Debian 13 "Trixie" ──────────────────────────────────────
  # Current stable. The "current" symlink at cdimage.debian.org
  # always points to the latest point release.
  # As of Nov 2026 the latest is 13.7.0.
  - name: debian-trixie-netinst-amd64
    label: "Debian 13 Trixie Netinst (amd64)"
    url: "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-13.7.0-amd64-netinst.iso"
    checksum_url: "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/SHA256SUMS"
    arch: amd64
    category: server

  - name: debian-trixie-netinst-arm64
    label: "Debian 13 Trixie Netinst (arm64)"
    url: "https://cdimage.debian.org/debian-cd/current/arm64/iso-cd/debian-13.7.0-arm64-netinst.iso"
    checksum_url: "https://cdimage.debian.org/debian-cd/current/arm64/iso-cd/SHA256SUMS"
    arch: arm64
    category: server

  # Keep Bookworm around — it's the base for older RPi OS images
  # and many existing deployments. 12.15 is the final release.
  - name: debian-bookworm-netinst-amd64
    label: "Debian 12.15 Bookworm Netinst (amd64) — oldstable/LTS"
    url: "https://cdimage.debian.org/cdimage/archive/12.15.0/amd64/iso-cd/debian-12.15.0-amd64-netinst.iso"
    checksum_url: "https://cdimage.debian.org/cdimage/archive/12.15.0/amd64/iso-cd/SHA256SUMS"
    arch: amd64
    category: server

  # ── Rescue / Recovery ────────────────────────────────────────
  # Using Fastly CDN for SystemRescue and direct SF links for
  # Clonezilla — SourceForge /download redirects break aria2c.
  - name: systemrescue
    label: "SystemRescue 13.02 — live repair and recovery"
    url: "https://fastly-cdn.system-rescue.org/releases/13.02/systemrescue-13.02-amd64.iso"
    arch: amd64
    category: rescue

  - name: clonezilla-amd64
    label: "Clonezilla Live 3.3.3-37 — disk imaging and cloning"
    url: "https://downloads.sourceforge.net/project/clonezilla/clonezilla_live_stable/3.3.3-37/clonezilla-live-3.3.3-37-amd64.iso"
    arch: amd64
    category: rescue

  # ── Raspberry Pi / ARM ───────────────────────────────────────
  # RPi OS now has Trixie-based images (kernel 6.18).
  # Check https://www.raspberrypi.com/software/operating-systems/
  # for the latest filenames — they change with each release.
  - name: raspios-desktop-arm64
    label: "Raspberry Pi OS Desktop Trixie (arm64)"
    url: "https://downloads.raspberrypi.com/raspios_arm64/images/raspios_arm64-2026-04-21/2026-04-21-raspios-trixie-arm64.img.xz"
    arch: arm64
    category: iot

  - name: raspios-lite-arm64
    label: "Raspberry Pi OS Lite Trixie (arm64) — headless"
    url: "https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-04-21/2026-04-21-raspios-trixie-arm64-lite.img.xz"
    arch: arm64
    category: iot

  # ── OpenWrt 25.12 ────────────────────────────────────────────
  # 25.12 is current stable.
  # This x86-64 image is for VMs and generic PC routers.
  # For specific router hardware, use the firmware selector:
  #   https://firmware-selector.openwrt.org/?version=25.12.5
  - name: openwrt-x86-64
    label: "OpenWrt 25.12.5 — x86-64 combined (ext4)"
    url: "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-25.12.5-x86-64-generic-ext4-combined.img.gz"
    arch: amd64
    category: embedded
